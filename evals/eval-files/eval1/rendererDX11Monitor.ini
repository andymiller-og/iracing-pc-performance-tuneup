[Display]
windowedWidth=3440                              	; windowed mode width
windowedHeight=1440                             	; windowed mode height
fullScreen=0                                    	; 0=windowed, 1=full screen
border=0                                        	; 0=no border, 1=border

[Graphics Options]
ShaderQuality=2                                 	; 0=low, 1=med, 2=high, 3=max
AntiAliasMethod=3                               	; The type of Anti Aliasing method used: 0=None, 1=MSAA, 2=FXAA, 3=SMAA
MSAASamples=2                                   	; The number of MSAA samples (if MSAA is in use): 2, 4 or 8
Sharpening=1                                    	; 0=off, 1=sharpening enabled
SharpeningAmount=125                            	; sharpening strength (10=min, 125=default, 300=max)
EnableHDR=0                                     	; 0=off, 1=on
ResolutionScaling=0                             	; 0=off, else percent
SSAO=0                                          	; 0=off, 1=on
HeatHaze=0                                      	; 0=off, 1=heat haze enabled
DepthOfField=0                                  	; 0=off, 1=depth of field blurs enabled
Distortion=0                                    	; 0=off, 1=on
SSRLevel=0                                      	; 0=off, 1=low res, 2=full res
ShadowMapType=0                                 	; 0=off, 1=on
DynamicShadowMaps=0                             	; 0=off, 1=on
ShadowDetail=0                                  	; 0=low, 1=high
DNSMEnable=0                                    	; 0=off 1=dynamic night shadow maps
SkyRefreshRate=1                                	; 0=low, 1=med, 2=high
CarDetail=2                                     	; 0=low, 1=med, 2=high
PitObjectDetail=0                               	; 0=off, 1=low, 2=med, 3=high
WeekendDetail=0                                 	; event detail
GrandstandDetail=0                              	; 0=low, 1=med, 2=high
CrowdDetail=0                                   	; 0=off, 1=low, 2=med, 3=high
ObjectDetail=1                                  	; object population
FoliageDetail=1                                 	; foliage density
TwoPassTrees=0                                  	; 0=off, 1=on
LowQualityTrees=1                               	; 1=low quality trees
ParticleDetail=1                                	; 0=low, 1=med, 2=high
ParticlesFullRes=0                              	; 0=reduced resolution, 1=full resolution
HeadlightLevel=0                                	; headlight detail
SteeringWheel=1                                 	; 0=off, 1=on
DriverHands=1                                   	; 0=no, 1=yes
MaxCockpitMirrors=0                             	; max cockpit mirrors
MirrorDetail=0                                  	; 0=off, 1=higher detail
VirtualMirrors=1                                	; 0=off, 1=on
HeadlightsInMirrors=0                           	; 0=off, 1=on
MaxCarsToDraw=36                                	; max cars to draw
MaxCarsToDrawInMirrors=12                       	; max cars to draw in mirrors
MaxPitObjsToDraw=20                             	; max pit objects
MaxPitObjsToDrawInMirrors=4                     	; max pit objects in mirrors
LODMinFPSTarget=60                              	; below this fps the sim lowers LOD
LODPctMin=100                                   	; LOD percent min
LimitFrameRate=1                                	; 0=no limit, 1=limit
DesiredFPSLimit=160                             	; frame rate limit
NvReflexMode=1                                  	; 0=off, 1=enabled, 2=enabled+boost
MaxPreRenderedFrames=1                          	; max pre-rendered frames
VerticalSync=0                                  	; 0=off, 1=on
CacheSwap3HighResCars=0                         	; 0=off, 1=on
CarPaint2048x2048=0                             	; 0=off, 1=on
VidMemToUseMB=6200                              	; video memory budget

