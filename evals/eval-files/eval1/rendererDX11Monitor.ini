[MonitorSetup]
NumMonitors=1                                   	; 1 or 3
MonitorType=1                                   	; 0=flat or 1=curved
MonitorWidth=820                                	; (mm) total width of each monitor (screen + bezels)
ScreenWidth=800                                 	; (mm) usable width of each screen (no bezels)
ViewingDist=700                                 	; (mm) Distance from eyes to center of monitor
RadiusOfCurvature=1500                          	; (mm) Radius of screen curvature (ignored if type is flat)
RenderViewPerMonitor=0                          	; 0=one projection, 1=one projection per monitor
EnableSMPSurround=0                             	; 0=off, 1=NVIDIA simultaneous multi-projection

